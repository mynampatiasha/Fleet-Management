<!DOCTYPE html>
<html>
<head>
    <title>GPS Location Test - Kasthuri Nagar</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; }
        .info { background-color: #d1ecf1; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>🗺️ GPS Location Test for SOS</h1>
    <p>This will help you check if your GPS is detecting the correct location.</p>
    
    <button onclick="getCurrentLocation()">📍 Get My Current Location</button>
    
    <div id="results"></div>
    
    <div class="info result">
        <h3>Expected for Kasthuri Nagar:</h3>
        <p><strong>Latitude:</strong> ~12.985</p>
        <p><strong>Longitude:</strong> ~77.636</p>
        <p><strong>Area:</strong> Should contain "Kasthuri Nagar" or nearby areas</p>
    </div>

    <script>
        function getCurrentLocation() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="info result">🔍 Getting your location...</div>';
            
            if (!navigator.geolocation) {
                resultsDiv.innerHTML = '<div class="error result">❌ Geolocation is not supported by this browser.</div>';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                async function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    let html = `
                        <div class="success result">
                            <h3>✅ Location Found!</h3>
                            <p><strong>Latitude:</strong> ${lat}</p>
                            <p><strong>Longitude:</strong> ${lon}</p>
                            <p><strong>Accuracy:</strong> ±${accuracy} meters</p>
                        </div>
                    `;
                    
                    // Check if coordinates match Kasthuri Nagar area
                    const kasturiLat = 12.9850;
                    const kasturiLon = 77.6362;
                    const distance = calculateDistance(lat, lon, kasturiLat, kasturiLon);
                    
                    if (distance < 2) {
                        html += `<div class="success result">🎯 <strong>CORRECT!</strong> You are near Kasthuri Nagar (${distance.toFixed(2)} km away)</div>`;
                    } else {
                        html += `<div class="error result">⚠️ <strong>LOCATION ISSUE!</strong> You are ${distance.toFixed(2)} km away from Kasthuri Nagar. This is why you're seeing Electronic City police stations.</div>`;
                    }
                    
                    // Try to get address
                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                        const data = await response.json();
                        html += `
                            <div class="info result">
                                <h3>📍 Detected Address:</h3>
                                <p>${data.display_name}</p>
                            </div>
                        `;
                    } catch (e) {
                        html += '<div class="error result">❌ Could not get address information</div>';
                    }
                    
                    resultsDiv.innerHTML = html;
                },
                function(error) {
                    let errorMsg = '';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "❌ Location access denied. Please enable location permissions.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "❌ Location information unavailable.";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "❌ Location request timed out.";
                            break;
                        default:
                            errorMsg = "❌ An unknown error occurred.";
                            break;
                    }
                    resultsDiv.innerHTML = `<div class="error result">${errorMsg}</div>`;
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
    </script>
</body>
</html>
