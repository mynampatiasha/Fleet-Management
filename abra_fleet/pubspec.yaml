name: abra_fleet
description: A fleet management application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- UI AND STATE MANAGEMENT ---
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  equatable: ^2.0.5
  google_nav_bar: ^5.0.6
  fl_chart: ^0.66.0
  flutter_svg: ^2.0.10+1
  image_picker: ^1.2.0
  mask_text_input_formatter: ^2.5.0
  intl_phone_field: ^3.2.0
  file_picker: ^8.0.0
  csv: ^5.0.2
  excel: ^4.0.2
  path_provider: ^2.1.1
  permission_handler: ^11.0.2
  share_plus: ^7.2.1
  pdf: ^3.10.7
  printing: ^5.11.1
  shared_preferences: ^2.2.2

  # --- ❌ FIREBASE REMOVED - NOW USING JWT AUTHENTICATION ---
  # firebase_core: ^3.6.0
  # firebase_auth: ^5.3.1
  # firebase_database: ^11.1.4
  # firebase_storage: ^12.3.2
  # cloud_firestore: ^5.4.4
  # firebase_messaging: ^15.1.3
  # cloud_functions: ^5.1.3
  
  uuid: ^4.2.1 

  # --- NOTIFICATIONS ---
  flutter_local_notifications: ^17.2.3
  onesignal_flutter: ^5.2.5
  
  # --- ❌ GOOGLE SIGN IN REMOVED (was Firebase dependent) ---
  # google_sign_in: ^6.1.5

  # --- NETWORKING & DATABASE ---
  http: ^1.2.0
  socket_io_client: ^2.0.3+1
  mongo_dart: ^0.10.0
  mongo_dart_query: ^5.0.2
  web_socket_channel: ^3.0.3

  # --- MAPS & LOCATION ---
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.2.0
  
  # --- UTILITIES ---
  flutter_dotenv: ^5.1.0
  audioplayers: ^6.0.0
  intl: ^0.19.0
  dio: ^5.4.1 
  
  # CHANGED: Use open_file instead of open_file_plus (more stable)
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/images/
    - assets/logo.png
    - assets/image.png
    - .env
    - assets/siren.mpeg
    - assets/Notification.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#ffffff"