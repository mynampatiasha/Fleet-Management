<!DOCTYPE html>
<html>
<head>
    <title>Test Flutter Login from Browser</title>
</head>
<body>
    <h1>Test JWT Login from Browser</h1>
    <button onclick="testLogin()">Test Login</button>
    <pre id="result"></pre>

    <script>
        async function testLogin() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = 'Testing login...\n';

            try {
                const response = await fetch('http://localhost:3001/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@abrafleet.com',
                        password: 'admin123'
                    })
                });

                resultEl.textContent += `Status: ${response.status}\n`;
                resultEl.textContent += `Status Text: ${response.statusText}\n`;
                resultEl.textContent += `Headers: ${JSON.stringify([...response.headers.entries()], null, 2)}\n\n`;

                const data = await response.json();
                resultEl.textContent += `Response:\n${JSON.stringify(data, null, 2)}\n`;

                if (data.success && data.data && data.data.token) {
                    resultEl.textContent += `\n✅ Token received: ${data.data.token.substring(0, 50)}...\n`;
                    resultEl.textContent += `✅ User ID: ${data.data.user.id}\n`;
                    resultEl.textContent += `✅ User Email: ${data.data.user.email}\n`;
                    resultEl.textContent += `✅ User Role: ${data.data.user.role}\n`;
                } else {
                    resultEl.textContent += `\n❌ No token in response\n`;
                }
            } catch (error) {
                resultEl.textContent += `\n❌ Error: ${error.message}\n`;
                resultEl.textContent += `Error stack: ${error.stack}\n`;
            }
        }
    </script>
</body>
</html>
