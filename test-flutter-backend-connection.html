<!DOCTYPE html>
<html>
<head>
    <title>Test Flutter Backend Connection</title>
</head>
<body>
    <h1>Testing Backend Connection</h1>
    <div id="results"></div>

    <script>
        async function testEndpoints() {
            const results = document.getElementById('results');
            const baseUrl = 'http://localhost:3001';
            
            const endpoints = [
                '/health',
                '/api/admin/drivers',
                '/api/admin/drivers/ratings'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${baseUrl}${endpoint}`);
                    results.innerHTML += `<p>✅ ${endpoint}: ${response.status} - ${response.statusText}</p>`;
                } catch (error) {
                    results.innerHTML += `<p>❌ ${endpoint}: ${error.message}</p>`;
                }
            }
        }
        
        testEndpoints();
    </script>
</body>
</html>
